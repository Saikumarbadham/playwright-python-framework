[pytest]
asyncio_mode = auto

addopts =
    -v
    -s
    --browser chromium
    --browser firefox
    --browser webkit
    --reruns 2
    --tracing retain-on-failure
    --screenshot only-on-failure
    --video retain-on-failure
    --tb=short
    -n 4

markers =
    smoke: Smoke test cases
    regression: Regression test cases
    ui: UI test cases
    api: API test cases